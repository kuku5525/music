.wrap{max-width:920px;margin:0 auto;padding:24px 16px 60px}

.sub{color:var(--ink2);font-size:13px;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink2);font:inherit;font-size:13.5px;font-weight:700;

.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.seg button.on{background:var(--gold);color:#181205}
.gear{color:var(--ink2);font-size:12.5px;margin:-6px 0 16px;line-height:1.6}
.gear b{color:var(--ink);font-weight:700}
.bar{position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:5;border-bottom:1px solid var(--line)}
#q{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-size:15px}
#q:focus{outline:2px solid var(--gold);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{cursor:pointer;user-select:none;border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600}
.chip.on{color:#fff}
.chip[data-t="ALL"].on{background:var(--gold);border-color:var(--gold);color:#181205}
.chip[data-t="S"].on{background:var(--s);border-color:var(--s)} .chip[data-t="A+"].on{background:var(--ap);border-color:var(--ap)}
.chip[data-t="A"].on{background:var(--a);border-color:var(--a)} .chip[data-t="B"].on{background:var(--b);border-color:var(--b)} .chip[data-t="C"].on{background:var(--c);border-color:var(--c)}
.chip[data-t="R"].on{background:var(--r);border-color:var(--r)}
.chip[data-t="SoundTest"].on{background:var(--st);border-color:var(--st)}
.tier{margin-top:26px}
.th{display:flex;align-items:baseline;gap:12px;padding:8px 2px;border-bottom:2px solid var(--tc);margin-bottom:4px;flex-wrap:wrap}
.th .star{font-size:18px;color:var(--tc);letter-spacing:1px} .th .nm{font-weight:700} .th .ds{color:var(--ink2);font-size:12.5px} .th .ct{margin-left:auto;color:var(--ink2);font-size:13px}
.tier[data-t="S"]{--tc:var(--s)}.tier[data-t="A+"]{--tc:var(--ap)}.tier[data-t="A"]{--tc:var(--a)}.tier[data-t="R"]{--tc:var(--r)}.tier[data-t="B"]{--tc:var(--b)}.tier[data-t="C"]{--tc:var(--c)}.tier[data-t="SoundTest"]{--tc:var(--st)}
.row{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:7px 4px;border-bottom:1px solid var(--line);align-items:baseline}
.row .a{font-weight:600} .row .t{color:var(--ink)} .row .al{color:var(--ink2);font-size:12.5px}
.row .meta{color:var(--ink2);font-size:11.5px;white-space:nowrap;text-align:right}
.row .dr{display:block;font-size:10.5px;opacity:.75}
.live{color:var(--gold);font-weight:600}
.mv{font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap}
.mv.up{color:var(--up)} .mv.dn{color:var(--dn);opacity:.7}
.empty{color:var(--ink2);padding:8px 4px;font-size:13px}
.foot{margin-top:34px;color:var(--ink2);font-size:12px;text-align:center;line-height:1.7}

const TOTAL=835;
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const COLL=new Intl.Collator('zh-Hans-CN',{numeric:true,sensitivity:'base'});
const grp=a=>/^[A-Za-z0-9]/.test(a||'')?0:1;   // 英文/数字歌手在前，中文按拼音在后
const byName=(x,y)=>grp(x.a)-grp(y.a)||COLL.compare(x.a||'',y.a||'')||COLL.compare(x.t||'',y.t||'');
const esc=s=>(s||"").replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
document.getElementById('tot').textContent=TOTAL;

let dev="traillii", activeTier="ALL", terms=[];
// 搜索命中范围：艺人 / 歌名 / 专辑 / 规格 / live-studio / DR
const hay=d=>d._h||(d._h=(d.a+" "+d.t+" "+d.al+" "+d.f+" "+(d.l?"live 现场":"studio 录音室")+" dr"+(d.c==null?"":d.c)).toLowerCase());
const hit=d=>terms.every(w=>w[0]==="-"?(w.length<2||!hay(d).includes(w.slice(1))):hay(d).includes(w));
const chipsWrap=document.getElementById('chips');

document.getElementById('seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  dev=b.dataset.d; activeTier="ALL";
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));
  buildChips(); paintGear(); render();
});

function M(){return META[dev];}
function tierOf(d){return dev==="atrium"?d.t2:d.t1;}

function paintGear(){
  const m=M();
  document.getElementById('gear').innerHTML=`<b>${esc(m.gear)}</b><br>${m.note}`;
}
function buildChips(){
  const m=M();
  chipsWrap.innerHTML="";
  [["ALL","全部",TOTAL]].concat(m.order.map(t=>[t,t,m.cnt[t]||0])).forEach(([t,lab,n])=>{
    if(t!=="ALL"&&!n&&t!=="S") return;
    const c=el('span','chip'+(t===activeTier?' on':''),`${esc(lab)} <span style="opacity:.7">${n}</span>`);
    c.dataset.t=t;
    c.onclick=()=>{activeTier=t;[...chipsWrap.children].forEach(x=>x.classList.toggle('on',x.dataset.t===t));render();};
    chipsWrap.appendChild(c);
  });
}
document.getElementById('q').addEventListener('input',e=>{terms=e.target.value.toLowerCase().split(/\s+/).filter(Boolean);render();});

function render(){
  const m=M(), list=document.getElementById('list');
  list.innerHTML=""; let shown=0;
  for(const t of m.order){
    if(activeTier!=="ALL"&&activeTier!==t) continue;
    let rows=DATA.filter(d=>tierOf(d)===t && (!terms.length || hit(d)));
    if(!rows.length) continue;
    rows=rows.slice().sort(byName);
    const sec=el('div','tier'); sec.dataset.t=t;
    sec.appendChild(el('div','th',
      `<span class="star">${m.star[t]}</span><span class="nm">${esc(t)}</span><span class="ds">${m.desc[t]}</span><span class="ct">${rows.length} 首</span>`));
    for(const d of rows){
      shown++;
      let mv="";
      if(dev==="atrium"&&d.m>0) mv=' <span class="mv up">↑ 升自 '+esc(d.t1)+'</span>';
      else if(dev==="atrium"&&d.m<0) mv=' <span class="mv dn">↓ 原 '+esc(d.t1)+'</span>';
      sec.appendChild(el('div','row',
        `<div><span class="a">${esc(d.a)}</span> · <span class="t">${esc(d.t)}</span>${d.l?' <span class="live">Live</span>':''}${mv}<div class="al">${esc(d.al)}</div></div>`+
        `<div class="meta">${esc(d.f)}${d.c!=null?`<span class="dr">DR ${d.c}</span>`:''}</div>`));
    }
    list.appendChild(sec);
  }
  if(!shown) list.innerHTML='<div class="empty">没有匹配的歌曲。换个关键词，或点「全部」。</div>';
}
buildChips(); paintGear(); render();
